spring:
  application:
    name: catalog
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${CATALOG_DB_USERNAME:ticketing}
    password: ${CATALOG_DB_PASSWORD:ticketing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server:
  port: 8081
management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include:
          - readinessState
          - db
          - kafka
