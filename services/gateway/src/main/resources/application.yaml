spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: health-gateway
              uri: http://localhost:9080
              predicates:
                - Path=/health/gateway
              filters:
                - SetPath=/actuator/health/readiness
              metadata:
                connect-timeout: 1000
                response-timeout: 2000
            - id: health-catalog
              uri: http://localhost:9081
              predicates:
                - Path=/health/catalog
              filters:
                - SetPath=/actuator/health/readiness
              metadata:
                connect-timeout: 1000
                response-timeout: 2000
            - id: health-reservation
              uri: http://localhost:9082
              predicates:
                - Path=/health/reservation
              filters:
                - SetPath=/actuator/health/readiness
              metadata:
                connect-timeout: 1000
                response-timeout: 2000
            - id: health-payment
              uri: http://localhost:9083
              predicates:
                - Path=/health/payment
              filters:
                - SetPath=/actuator/health/readiness
              metadata:
                connect-timeout: 1000
                response-timeout: 2000
            - id: health-notification
              uri: http://localhost:9084
              predicates:
                - Path=/health/notification
              filters:
                - SetPath=/actuator/health/readiness
              metadata:
                connect-timeout: 1000
                response-timeout: 2000
server:
  port: 8080
management:
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
